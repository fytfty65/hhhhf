<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 墨蓝底：从上左微亮的石板蓝压到右下近黑，给圆角矩形一点纵深 -->
    <linearGradient id="tileBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283F"/>
      <stop offset="0.5" stop-color="#0D1827"/>
      <stop offset="1" stop-color="#080F1A"/>
    </linearGradient>
    <!-- 左上暖光 / 右下冷光：品牌双色的余韵，不抢主体 -->
    <radialGradient id="warmGlow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FF8E53" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#FF8E53" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF8E53" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolGlow" cx="0.93" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#4FACFE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4FACFE" stop-opacity="0"/>
    </radialGradient>
    <!-- 内描边模拟玻璃高光 -->
    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <!-- 航路环：香槟金 → 珊瑚 → 玫红，是整枚图标唯一的暖色主体 -->
    <linearGradient id="ringWarm" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FFDDB6"/>
      <stop offset="0.30" stop-color="#FFB271"/>
      <stop offset="0.62" stop-color="#FF8A5C"/>
      <stop offset="0.88" stop-color="#F76A63"/>
      <stop offset="1" stop-color="#E85B6B"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#tileBase)"/>
  <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#warmGlow)"/>
  <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#coolGlow)"/>
  <rect x="0.55" y="0.55" width="46.9" height="46.9" rx="11.45" fill="none" stroke="url(#rimLight)" stroke-width="1.1"/>

  <!-- 航路环：300° 圆环，缺口留在右上角，交给青色航点收尾 -->
  <path d="M35.88 20.82 A12.3 12.3 0 1 1 27.18 12.12" fill="none" stroke="#FF8E53" stroke-opacity="0.16" stroke-width="9.2" stroke-linecap="round" filter="url(#bloom)"/>
  <path d="M35.88 20.82 A12.3 12.3 0 1 1 27.18 12.12" fill="none" stroke="#000000" stroke-opacity="0.30" stroke-width="6.4" stroke-linecap="round" filter="url(#drop)" transform="translate(0.3 1)"/>
  <path d="M35.88 20.82 A12.3 12.3 0 1 1 27.18 12.12" fill="none" stroke="url(#ringWarm)" stroke-width="6.2" stroke-linecap="round"/>

  <!-- 航点：青色宝石，用一圈淡光困住，避免在 16px 下糊成一团 -->
  <circle cx="32.70" cy="15.30" r="4.3" fill="#5FE0EF" fill-opacity="0.28"/>
  <circle cx="32.70" cy="15.30" r="3.3" fill="#62E3EF"/>
  <circle cx="31.55" cy="14.15" r="1.0" fill="#FFFFFF" fill-opacity="0.88"/>
</svg>
