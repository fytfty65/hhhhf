name: omniroute-ci

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the toolchain from go.mod instead of pinning it separately.
          # The previous `1.24.x` conflicted with `go 1.26.2` in gateway/go.mod:
          # with GOTOOLCHAIN=local the job failed to build, and with `auto` the
          # pin was meaningless because Go downloaded a different toolchain.
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
