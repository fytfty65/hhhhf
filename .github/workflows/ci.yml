name: omniroute-ci

on:
  push:
  pull_request:

# Least privilege: the default token is read/write on many repos, and none of
# these jobs need to write anything back to the repository.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the toolchain from go.mod instead of pinning it separately.
          # The previous `1.24.x` conflicted with `go 1.26.2` in gateway/go.mod:
          # with GOTOOLCHAIN=local the job failed to build, and with `auto` the
          # pin was meaningless because Go downloaded a different toolchain.
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      # govulncheck reports only vulnerabilities that are actually reachable from
      # this module's call graph, so it does not fail on advisories in code the
      # gateway never calls. A Go CVE in a dependency was previously invisible to
      # CI because nothing scanned dependencies at all.
      #
      # Hard gate: the baseline was driven to zero reachable findings (25 -> 0)
      # by bumping the toolchain to Go 1.26.10 in go.mod and x/net v0.60.0,
      # x/text v0.42.0, quic-go v0.59.1. A new reachable advisory should fail CI.
      - name: govulncheck (reachable dependency vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # One source of truth for the interpreter: the same file the Windows
          # bootstrap script reads. Local and CI must run the same minor version,
          # otherwise `unittest discover` and mypy can disagree without either
          # side being obviously wrong.
          python-version-file: ai-service/.python-version
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      # Everything below used to be four separate steps duplicated from the
      # README. `tools/check.py` is now the single definition of "green" and is
      # what developers run locally, so CI cannot drift from the documented
      # command. It runs: preflight -> unittest -> ruff -> mypy -> pip-audit.
      #
      # Each of those is a hard gate. The ruff (78 -> 0) and mypy (159 -> 0)
      # baselines were driven to zero against the versions pinned in
      # requirements-dev.txt, and pip-audit reports no known vulnerabilities on
      # a clean install, so a new finding should fail CI instead of scrolling by.
      - name: all AI service gates
        env:
          PYTHONPATH: ${{ github.workspace }}/ai-service
          PYTHONIOENCODING: utf-8
        run: python tools/check.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npx tsc --noEmit --pretty false
      - name: npm audit (production dependencies)
        # Hard gate: the 8 advisories (next / sharp / source-map-js / firebase ->
        # @grpc/grpc-js) were fixed by bumping those pins plus an override for
        # @grpc/grpc-js, and `npm audit --omit=dev` now reports zero.
        run: npm audit --omit=dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
